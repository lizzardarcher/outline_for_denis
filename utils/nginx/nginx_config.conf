server {
    listen 80;
    listen [::]:80;
    server_name domvpn.su domvpn.fun dom-vpn.su domvpn.cfd  vpn-dom.ru dom-vpn.cfd dom-vpn.fun dom-vpn.site dom-vpn.space dom-vpn.store dom-vpn.website dom-vps.site;
    return 301 https://$host$request_uri;
}

server {
    listen [::]:443 ssl;
    listen 443 ssl http2;
    server_name domvpn.su dom-vpn.su domvpn.fun vpn-dom.ru domvpn.cfd dom-vpn.cfd dom-vpn.fun dom-vpn.site dom-vpn.space dom-vpn.store dom-vpn.website dom-vps.site;

    proxy_connect_timeout       1200s;
    proxy_send_timeout          1200s;
    proxy_read_timeout          1200s;
    send_timeout                1200s;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
    ssl_certificate /etc/letsencrypt/live/domvpn.su/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/domvpn.su/privkey.pem; # managed by Certbot


    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_protocols TLSv1.2;
    ssl_prefer_server_ciphers on;


    access_log  /var/log/nginx/domains/domvpn.su.log combined;
    error_log   /var/log/nginx/domains/domvpn.su.error.log error;

    location / {
        proxy_pass http://unix:/run/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/outline/static/;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header X-Frame-Options DENY;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
        add_header Content-Security-Policy "default-src 'self' *stackpath.bootstrapcdn.com *cdnjs.cloudflare.com *code.jquery.com *yookassa.ru *ajax.googleapis.com *fonts.googleapis.com";
    }
}
